<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>The Crown of Haiti | Historical Fiction Series</title>

  <meta
    name="description"
    content="The Crown of Haiti is a historical fiction series exploring Haiti’s revolutionary legacy, sovereignty, memory, culture, and unfinished promise."
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --black: #080604;
      --deep-black: #030201;
      --red: #7d1117;
      --dark-red: #3e090d;
      --gold: #d2ad55;
      --light-gold: #f0d48d;
      --parchment: #eadbb7;
      --cream: #f7efd9;
      --muted: #c8b98f;
      --border: rgba(210, 173, 85, 0.45);
    }

    html {
      scroll-behavior: smooth;
      background: var(--deep-black);
    }

    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top, rgba(125, 17, 23, 0.28), transparent 38rem),
        linear-gradient(180deg, #120705 0%, var(--black) 45%, #060302 100%);
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin-inline: auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      background: rgba(3, 2, 1, 0.94);
      backdrop-filter: blur(12px);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      color: var(--light-gold);
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.86rem;
    }

    .nav-links a {
      color: var(--parchment);
      text-decoration: none;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--light-gold);
    }

    .hero {
      position: relative;
      min-height: 78vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(rgba(3, 2, 1, 0.56), rgba(3, 2, 1, 0.92)),
        radial-gradient(circle at 50% 28%, rgba(210, 173, 85, 0.18), transparent 28rem),
        linear-gradient(135deg, #4a0b10, #080604 62%);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(210, 173, 85, 0.32);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
      padding: 110px 0 90px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--light-gold);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--light-gold);
      font-size: clamp(3rem, 9vw, 7.2rem);
      line-height: 0.95;
      letter-spacing: 0.035em;
      text-shadow: 0 5px 28px rgba(0, 0, 0, 0.76);
    }

    .hero-subtitle {
      margin: 22px 0 0;
      color: var(--parchment);
      font-size: clamp(1.3rem, 3vw, 2.15rem);
      font-style: italic;
    }

    .hero-copy {
      max-width: 760px;
      margin: 24px auto 0;
      color: #eadfc4;
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border: 1px solid var(--gold);
      color: #140b05;
      background: linear-gradient(180deg, var(--light-gold), var(--gold));
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.92rem;
      font-weight: bold;
      letter-spacing: 0.045em;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }

    .button.secondary {
      color: var(--light-gold);
      background: rgba(5, 3, 2, 0.72);
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    section {
      padding: 84px 0;
    }

    .section-heading {
      margin: 0 0 16px;
      color: var(--light-gold);
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 1.05;
      text-align: center;
    }

    .section-lead {
      max-width: 800px;
      margin: 0 auto;
      color: var(--parchment);
      font-size: 1.08rem;
      text-align: center;
    }

    .series-intro {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent),
        #0c0604;
    }

    .books {
      border-block: 1px solid rgba(210, 173, 85, 0.2);
      background: #080403;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      margin-top: 44px;
    }

    .book-card {
      min-height: 280px;
      display: flex;
      flex-direction: column;
