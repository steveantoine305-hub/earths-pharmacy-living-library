name: Generate Internal Monographs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate internal monographs
        run: python scripts/generate-internal-monographs.py

      - name: Commit generated internal files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/internal/monographs data/library/full-ingest-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate experimental internal monographs"
          git push
