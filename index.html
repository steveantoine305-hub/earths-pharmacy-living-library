<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Earth’s Pharmacy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #06180f;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .homepage-design {
      display: block;
      width: 100%;
      max-width: 1536px;
      height: auto;
      margin: 0 auto;
    }
    .homepage-wrapper {
  position: relative;
  width: 100%;
  max-width: 1536px;
  margin: 0 auto;
}

.pathway {
  position: absolute;
  display: block;
  z-index: 999;
  background: transparent;
  border: none;
  cursor: pointer;
  touch-action: manipulation;
}

.pathway-library {
  left: 4%;
  top: 43%;
  width: 29%;
  height: 33%;
}

.pathway-monographs {
  left: 35.5%;
  top: 43%;
  width: 29%;
  height: 33%;
}
 
/* Ensure the Founder’s Edition anchor has a clickable overlay.
   Values mirror the other pathway boxes so the visual design is unchanged. */
.pathway-founders {
  left: 67%;
  top: 43%;
  width: 29%;
  height: 33%;
}
    
  .pathway {
  -webkit-tap-highlight-color: transparent;
}

.pathway:focus {
  outline: none;
}

.pathway:focus-visible {
  outline: 3px solid #c9a34e;
  outline-offset: 4px;
}
  </style>
</head>

<body>
  <main class="homepage">
    <div class="homepage-wrapper">
      <img
        class="homepage-design"
        src="Earths_Pharmacy_Homepage_Refined_Professional_Approved.png"
        alt="The Earth’s Pharmacy homepage"
      >

      <a
        class="pathway pathway-library"
        href="/living-library/"
        aria-label="Enter the Living Evidence Library"
      ></a>

      <a
        class="pathway pathway-monographs"
        href="/monographs/"
        aria-label="Explore the medicinal plant monographs"
      ></a>

      <a
        class="pathway pathway-founders"
        href="/founders-edition/"
        aria-label="View the Founder’s Edition"
      ></a>
    </div>
  </main>
</body>
</html>
